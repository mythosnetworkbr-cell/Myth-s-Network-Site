<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050507"><title>Meu Perfil • Rede Mythøs</title>
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#050507;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(760px,100%);margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.logo{font-size:22px;font-weight:950}.grad{background:linear-gradient(90deg,#19dcff,#a83cff,#ff22d5);-webkit-background-clip:text;background-clip:text;color:transparent}.back{color:#fff;text-decoration:none;border:1px solid #34313e;border-radius:10px;padding:9px 12px;font-size:12px}.box{border:1px solid #292936;border-radius:20px;background:linear-gradient(145deg,#12121a,#08080c);padding:26px;box-shadow:0 25px 90px #000}.title{font-size:27px;font-weight:950;margin:0}.muted{color:#8d8998;font-size:12px;line-height:1.6}.profileHead{display:flex;gap:22px;align-items:center;margin:20px 0 26px}.avatarWrap{position:relative;flex:none}.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid transparent;background:linear-gradient(#09090d,#09090d) padding-box,linear-gradient(135deg,#18d9ff,#a83cff,#ff18d0) border-box;box-shadow:0 0 35px #17d9f633}.avatarFallback{display:grid;place-items:center;background:linear-gradient(135deg,#752cff,#13dced);font-size:40px;font-weight:950}.camera{position:absolute;right:-2px;bottom:2px;width:39px;height:39px;border-radius:50%;border:2px solid #050507;background:#101016;color:#fff;cursor:pointer;font-size:18px}.photoActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:13px 17px;background:#10dcec;color:#031014;font-weight:950;cursor:pointer}.btn.alt{background:#17171d;color:#fff;border:1px solid #343440}.btn.danger{background:#160d12;color:#ff719e;border:1px solid #7d3148}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{display:block;color:#b8b3c3;font-size:10px;font-weight:900;letter-spacing:1.5px;margin-bottom:7px}.field input{width:100%;padding:13px;background:#07070b;border:1px solid #30303a;border-radius:9px;color:#fff;outline:0}.field input:focus{border-color:#16dff5}.status{min-height:22px;margin-top:13px;font-size:12px;color:#63ffc9}.status.err{color:#ff6c9f}.login{max-width:430px;margin:10vh auto}@media(max-width:620px){.wrap{padding:13px}.box{padding:20px}.profileHead{align-items:flex-start}.avatar{width:94px;height:94px}.grid{grid-template-columns:1fr}.title{font-size:23px}} </style></head><body><main class="wrap"><div class="top"><div class="logo">REDE <span class="grad">MYTHØS</span></div><a class="back" href="/">← SITE</a></div><section id="login" class="box login"><h1 class="title">Entrar na conta</h1><p class="muted">Entre para editar sua foto e seus dados do perfil.</p><input id="email" class="fieldInput" style="width:100%;padding:13px;background:#07070b;border:1px solid #30303a;border-radius:9px;color:#fff;margin:6px 0" type="email" placeholder="E-mail"><input id="password" style="width:100%;padding:13px;background:#07070b;border:1px solid #30303a;border-radius:9px;color:#fff;margin:6px 0" type="password" placeholder="Senha"><button class="btn" style="width:100%;margin-top:8px" onclick="login()">ENTRAR</button><div id="loginMsg" class="status"></div></section><section id="profile" class="box" style="display:none"><h1 class="title">Meu Perfil</h1><p class="muted">Sua foto aparece na conta e pode ser alterada quando quiser.</p><div class="profileHead"><div class="avatarWrap"><img id="avatar" class="avatar" alt="Foto do perfil"><button class="camera" onclick="$('photo').click()" title="Alterar foto">✎</button></div><div><div id="displayName" style="font-size:21px;font-weight:900"></div><div id="emailText" class="muted"></div><div class="photoActions"><button class="btn" onclick="$('photo').click()">ALTERAR FOTO</button><button class="btn danger" onclick="removePhoto()">REMOVER FOTO</button></div><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" hidden></div></div><div class="grid"><div class="field"><label>NOME DE EXIBIÇÃO</label><input id="name" maxlength="60"></div><div class="field"><label>USUÁRIO</label><input id="username" maxlength="32"></div></div><button class="btn" style="margin-top:15px" onclick="save()">SALVAR PERFIL</button><div id="saveMsg" class="status"></div></section></main><script>const $=id=>document.getElementById(id);let user=null,avatarData=null;const token=()=>localStorage.getItem('mythos_token');function esc(s){return String(s||'')}function setAvatar(url){avatarData=url||null;const img=$('avatar');if(url){img.src=url;img.classList.remove('avatarFallback')}else{img.removeAttribute('src');img.classList.add('avatarFallback');img.alt='Foto'}img.onerror=()=>{img.removeAttribute('src');img.classList.add('avatarFallback')}}function render(u){user=u;$('login').style.display='none';$('profile').style.display='block';$('displayName').textContent=u.display_name||u.username||'Jogador';$('emailText').textContent=u.email||'';$('name').value=u.display_name||'';$('username').value=u.username||'';setAvatar(u.avatar_url)}async function login(){const m=$('loginMsg');m.textContent='';try{const r=await fetch('/api/auth?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha no login');localStorage.setItem('mythos_token',j.token);render(j.user)}catch(e){m.className='status err';m.textContent=e.message}}$('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type))return $('saveMsg').textContent='Use JPG, PNG ou WEBP.';if(f.size>2000000)return $('saveMsg').textContent='A foto deve ter no máximo 2 MB.';const rd=new FileReader();rd.onload=()=>setAvatar(rd.result);rd.readAsDataURL(f)});function removePhoto(){setAvatar(null)}async function save(){const t=token(),m=$('saveMsg');if(!t){location.reload();return}m.className='status';m.textContent='Salvando...';try{const r=await fetch('/api/auth?action=profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify({avatar_url:avatarData,display_name:$('name').value.trim(),username:$('username').value.trim()})});const j=await r.json();if(!r.ok)throw Error(j.error||'Não foi possível salvar.');render(j.user);m.textContent='Perfil atualizado com sucesso.'}catch(e){m.className='status err';m.textContent=e.message}}(async()=>{const t=token();if(!t)return;try{const r=await fetch('/api/auth?action=me',{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(j.user)render(j.user);else localStorage.removeItem('mythos_token')}catch{}})();</script></body></html>
