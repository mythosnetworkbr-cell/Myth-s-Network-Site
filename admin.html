<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>Mythøs • Painel Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050507;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(920px,100%);margin:auto;padding:22px}.box{border:1px solid #302b3b;border-radius:20px;background:linear-gradient(145deg,#12101a,#08080c);box-shadow:0 25px 90px #000;padding:26px}.brand{font-size:24px;font-weight:950}.grad{background:linear-gradient(90deg,#19dcff,#a83cff,#ff22d5);-webkit-background-clip:text;color:transparent}.muted{color:#8d8998;font-size:12px;line-height:1.6}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.close{color:#fff;text-decoration:none;border:1px solid #34313e;border-radius:9px;padding:9px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;color:#b8b3c3;font-size:11px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px;background:#08080c;border:1px solid #302d38;border-radius:9px;color:#fff;outline:none}.field input:focus{border-color:#16dff5}.btn{border:0;border-radius:10px;padding:14px 18px;background:#10dcec;color:#031014;font-weight:950;cursor:pointer}.msg{min-height:22px;color:#63ffc9;font-size:12px;margin-top:12px}.err{color:#ff6c9f}.login{max-width:430px;margin:10vh auto}.hidden{display:none}.note{padding:13px;border:1px solid #292531;border-radius:11px;background:#0b0a10;margin-bottom:17px;font-size:11px;color:#96919f}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.box{padding:20px}}</style></head><body><main class="wrap"><section id="loginBox" class="box login"><div class="brand">REDE <span class="grad">MYTHØS</span></div><p class="muted">Painel administrativo. Entre com uma conta que possua permissão <b>admin</b>.</p><div class="field"><label>E-MAIL</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>SENHA</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">ENTRAR NO PAINEL</button><div id="loginMsg" class="msg"></div></section><section id="adminBox" class="box hidden"><div class="head"><div><div class="brand">PAINEL <span class="grad">MYTHØS</span></div><div class="muted">Gerencie os endereços usados pelos botões da home.</div></div><a class="close" href="/">← Site</a></div><div class="note">As alterações ficam salvas no banco do projeto. Não é necessário editar o código para trocar APK, Discord, Loja, Suporte ou vídeo.</div><div class="grid"><div class="field"><label>LINK DO APK</label><input id="apkUrl" type="url"></div><div class="field"><label>LINK DO DISCORD</label><input id="discordUrl" type="url"></div><div class="field"><label>LINK DA LOJA</label><input id="storeUrl" type="url"></div><div class="field"><label>LINK DOS TICKETS / SUPORTE</label><input id="supportUrl" type="url"></div><div class="field"><label>VÍDEO DA HOME (URL EMBED)</label><input id="videoUrl" type="url"></div></div><button class="btn" onclick="save()">SALVAR ALTERAÇÕES</button><div id="saveMsg" class="msg"></div></section></main><script>const $=id=>document.getElementById(id);async function login(){const m=$('loginMsg');m.className='msg';m.textContent='';try{const r=await fetch('/api/auth?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha no login');if(j.user.role!=='admin')throw Error('Esta conta não possui acesso administrativo.');localStorage.setItem('mythos_admin_token',j.token);show();}catch(e){m.className='msg err';m.textContent=e.message}}function show(){$('loginBox').classList.add('hidden');$('adminBox').classList.remove('hidden');load()}async function load(){const r=await fetch('/api/settings');const j=await r.json();Object.keys(j.settings||{}).forEach(k=>{if($(k))$(k).value=j.settings[k]})}async function save(){const token=localStorage.getItem('mythos_admin_token'),m=$('saveMsg');m.className='msg';m.textContent='Salvando...';const body={};['apkUrl','discordUrl','storeUrl','supportUrl','videoUrl'].forEach(k=>body[k]=$(k).value);try{const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Não foi possível salvar');m.textContent='Links atualizados com sucesso.'}catch(e){m.className='msg err';m.textContent=e.message}}(async()=>{const t=localStorage.getItem('mythos_admin_token');if(!t)return;try{const r=await fetch('/api/auth?action=me',{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(j.user?.role==='admin')show()}catch{}})();</script></body></html>
