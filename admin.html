<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050507"><title>Mythøs • Painel Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#050507;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:18px}.box{border:1px solid #302b3b;border-radius:18px;background:linear-gradient(145deg,#12101a,#08080c);padding:22px;margin-bottom:14px}.brand{font-size:24px;font-weight:950}.grad{background:linear-gradient(90deg,#19dcff,#a83cff,#ff22d5);-webkit-background-clip:text;color:transparent}.muted{color:#8d8998;font-size:12px;line-height:1.6}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.close{color:#fff;text-decoration:none;border:1px solid #34313e;border-radius:9px;padding:9px 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#b8b3c3;font-size:11px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px;background:#08080c;border:1px solid #302d38;border-radius:9px;color:#fff;outline:none}.btn{border:0;border-radius:10px;padding:13px 17px;background:#10dcec;color:#031014;font-weight:950;cursor:pointer}.msg{min-height:22px;color:#63ffc9;font-size:12px;margin-top:10px}.err{color:#ff6c9f}.login{max-width:430px;margin:10vh auto}.hidden{display:none}.note,.ticket{padding:13px;border:1px solid #292531;border-radius:11px;background:#0b0a10;margin-bottom:10px}.ticket{cursor:pointer}.ticket:hover{border-color:#6941a8}.ticket strong{display:block}.ticket small{color:#85818d}.badge{float:right;padding:5px 8px;border-radius:999px;background:#17252a;color:#24e1f4;font-size:9px;font-weight:900}.messages{max-height:420px;overflow:auto;margin:15px 0}.message{padding:12px;border:1px solid #292936;border-radius:10px;background:#0b0b10;margin:8px 0}.message.staff{border-color:#6539a5;background:#130d1c}.message small{display:block;color:#777783;font-size:10px;margin-bottom:5px}textarea{width:100%;min-height:100px;padding:12px;background:#08080c;border:1px solid #302d38;border-radius:9px;color:#fff;margin:8px 0;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn.alt{background:#17171d;color:#fff;border:1px solid #343440}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><section id="loginBox" class="box login"><div class="brand">REDE <span class="grad">MYTHØS</span></div><p class="muted">Painel administrativo. Acesso somente para contas com permissão admin.</p><div class="field"><label>E-MAIL</label><input id="email" type="email"></div><div class="field"><label>SENHA</label><input id="password" type="password"></div><button class="btn" onclick="login()">ENTRAR NO PAINEL</button><div id="loginMsg" class="msg"></div></section><section id="adminBox" class="hidden"><div class="box"><div class="head"><div><div class="brand">PAINEL <span class="grad">MYTHØS</span></div><div class="muted">Links da home e atendimento de tickets em um só lugar.</div></div><a class="close" href="/">← Site</a></div><div class="grid"><div class="field"><label>LINK DO APK</label><input id="apkUrl" type="url"></div><div class="field"><label>LINK DO DISCORD</label><input id="discordUrl" type="url"></div><div class="field"><label>LINK DA LOJA</label><input id="storeUrl" type="url"></div><div class="field"><label>LINK DOS TICKETS / SUPORTE</label><input id="supportUrl" type="url"></div><div class="field"><label>VÍDEO DA HOME</label><input id="videoUrl" type="url"></div></div><button class="btn" onclick="save()">SALVAR LINKS</button><div id="saveMsg" class="msg"></div></div><div class="box"><div class="head"><div><div class="brand">TICKETS <span class="grad">DE SUPORTE</span></div><div class="muted">Abra, responda, acompanhe e encerre atendimentos sem sair do site.</div></div><button class="btn" onclick="loadTickets()">ATUALIZAR</button></div><div id="tickets">Carregando...</div></div><div id="selected" class="box hidden"><div class="head"><div><div class="brand" id="ticketTitle"></div><div class="muted" id="ticketMeta"></div></div><button class="close" onclick="closeSelected()">Fechar</button></div><div id="messages" class="messages"></div><textarea id="reply" placeholder="Responder ao jogador..."></textarea><div class="row"><button class="btn" onclick="replyTicket()">RESPONDER</button><button class="btn alt" onclick="setStatus('close')">ENCERRAR TICKET</button><button class="btn alt" onclick="setStatus('reopen')">REABRIR</button></div><div id="ticketMsg" class="msg"></div></div></section></main><script>const $=id=>document.getElementById(id);let selected=null;const token=()=>localStorage.getItem('mythos_admin_token');function auth(){return{Authorization:'Bearer '+token(),'Content-Type':'application/json'}}async function login(){try{const r=await fetch('/api/auth?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha no login');if(j.user.role!=='admin')throw Error('Sem permissão administrativa.');localStorage.setItem('mythos_admin_token',j.token);show()}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent=e.message}}async function show(){$('loginBox').classList.add('hidden');$('adminBox').classList.remove('hidden');await loadSettings();loadTickets()}async function loadSettings(){const r=await fetch('/api/settings'),j=await r.json();Object.keys(j.settings||{}).forEach(k=>$(k)&&($(k).value=j.settings[k]))}async function save(){const body={};['apkUrl','discordUrl','storeUrl','supportUrl','videoUrl'].forEach(k=>body[k]=$(k).value);const r=await fetch('/api/settings',{method:'POST',headers:auth(),body:JSON.stringify(body)}),j=await r.json();$('saveMsg').textContent=r.ok?'Links atualizados com sucesso.':j.error||'Erro'}async function loadTickets(){const r=await fetch('/api/tickets',{headers:{Authorization:'Bearer '+token()}}),j=await r.json();if(!r.ok){$('tickets').textContent=j.error||'Erro';return}$('tickets').innerHTML=(j.tickets||[]).length?(j.tickets.map(t=>`<div class="ticket" onclick='openTicket(${JSON.stringify(t.code)})'><span class="badge">${t.status==='closed'?'ENCERRADO':t.status==='waiting_user'?'AGUARDANDO':'ABERTO'}</span><strong>${esc(t.subject)}</strong><small>${esc(t.code)} • ${esc(t.category)} • ${esc(t.name)}</small></div>`).join('')):'<div class="muted">Nenhum ticket aberto.</div>'}async function openTicket(code){const r=await fetch('/api/tickets?code='+encodeURIComponent(code)),j=await r.json();if(!r.ok)return;$selected=j.ticket;renderSelected()}function renderSelected(){if(!selected)return;$('selected').classList.remove('hidden');$('ticketTitle').textContent=selected.subject;$('ticketMeta').textContent=selected.code+' • '+selected.category+' • '+selected.name;$('messages').innerHTML=selected.messages.map(m=>`<div class="message ${m.staff?'staff':''}"><small>${esc(m.author)} • ${new Date(m.created_at).toLocaleString('pt-BR')}${m.staff?' • EQUIPE':''}</small>${esc(m.body).replace(/\n/g,'<br>')}</div>`).join('');$('reply').disabled=selected.status==='closed'}async function replyTicket(){const body=$('reply').value.trim();if(!body||!selected)return;const r=await fetch('/api/tickets',{method:'POST',headers:auth(),body:JSON.stringify({action:'reply',code:selected.code,body})}),j=await r.json();if(!r.ok){$('ticketMsg').className='msg err';$('ticketMsg').textContent=j.error;return}selected=j.ticket;$('reply').value='';$('ticketMsg').textContent='Resposta enviada.';renderSelected();loadTickets()}async function setStatus(action){if(!selected)return;const r=await fetch('/api/tickets',{method:'POST',headers:auth(),body:JSON.stringify({action,code:selected.code})}),j=await r.json();if(!r.ok)return $('ticketMsg').textContent=j.error;selected=j.ticket;renderSelected();loadTickets()}function closeSelected(){$('selected').classList.add('hidden');selected=null}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}(async()=>{const t=token();if(!t)return;try{const r=await fetch('/api/auth?action=me',{headers:{Authorization:'Bearer '+t}}),j=await r.json();if(j.user?.role==='admin')show()}catch{}})();</script></body></html>
