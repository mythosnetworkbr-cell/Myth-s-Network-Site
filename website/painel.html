<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Mythøs Network</title><link rel="stylesheet" href="styles.css"></head><body><div class="neon-bg"></div><header class="nav"><a class="brand" href="index.html"><span>MYTHØS</span><small>NETWORK</small></a><nav><a href="index.html">Início</a><a href="regras.html">Regras</a></nav><button id="logout" class="login">Sair</button></header><main class="section-glow dashboard"><span class="eyebrow">ÁREA DO JOGADOR</span><h1 id="welcome">Meu painel</h1><p id="account-email"></p><div class="dashboard-grid"><section class="cards-panel"><h2>Meus tickets</h2><div id="tickets">Carregando...</div></section><section class="cards-panel"><h2>Conta</h2><p>Acompanhe seus atendimentos e atualizações da Mythøs Network.</p><a class="button" href="index.html#support">Novo ticket</a></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=window.supabase.createClient('https://rcjexjhziwcynsjmcdap.supabase.co','sb_publishable_OglouaI2szEvKmNvK3HEUQ_IOuHv-V-');const tickets=document.querySelector('#tickets');(async()=>{const {data:{user}}=await s.auth.getUser();if(!user){location.href='index.html#login';return;}document.querySelector('#account-email').textContent=user.email;const {data,error}=await s.from('support_tickets').select('id,category,subject,status,created_at').order('created_at',{ascending:false});if(error){tickets.textContent=error.message;return;}if(!data.length){tickets.innerHTML='<p>Nenhum ticket aberto.</p>';return;}tickets.innerHTML=data.map(t=>`<article class="ticket-card"><b>#${t.id}</b><h3>${t.subject}</h3><p>${t.category} · ${t.status}</p><small>${new Date(t.created_at).toLocaleString('pt-BR')}</small></article>`).join('');})();document.querySelector('#logout').onclick=async()=>{await s.auth.signOut();location.href='index.html';};</script></body></html>
