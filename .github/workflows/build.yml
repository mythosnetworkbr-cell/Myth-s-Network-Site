name: Mythøs Site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: mythos-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build + verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate build scripts
        run: npm run prebuild
      - name: Build site
        run: npm run build
      - name: Verify generated site
        run: npm run verify
