name: Mythøs Site Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Validate JavaScript syntax
        run: npm run prebuild
      - name: Build site
        run: npm run build
      - name: Verify generated site
        run: |
          test -f dist/index.html
          test -f dist/regras.html
          test -f dist/admin.html
          test -f dist/regras-policia.html
          test -s dist/index.html
          test -s dist/regras.html
          test -s dist/admin.html
          echo "Mythøs site build OK"
