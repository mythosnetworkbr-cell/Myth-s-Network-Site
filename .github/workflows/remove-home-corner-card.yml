name: Add Admin Access

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-admin:
    if: ${{ !contains(github.event.head_commit.message, '[admin-button-added]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add admin access button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''.adminAccess{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:11px;background:linear-gradient(135deg,#ffb000,#ff4d00);border:1px solid #ffc44d;color:#160900;font-size:12px;font-weight:950;box-shadow:0 8px 25px #ff7a001f;white-space:nowrap}.adminAccess:hover{filter:brightness(1.08);transform:translateY(-1px)}@media(max-width:900px){.adminAccess{display:none}.drawerAdmin{display:block!important}}'''
          if '.adminAccess{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          button = '<a class="adminAccess" href="/painel-admin">⚙ PAINEL ADMIN</a>'
          if 'class="adminAccess"' not in s:
              marker = '<div class="navRight">'
              if marker in s:
                  s = s.replace(marker, marker + button, 1)

          drawer_button = '<a class="drawerAdmin" href="/painel-admin" style="display:block;color:#ffb000;font-weight:950">⚙ PAINEL ADMINISTRATIVO</a>'
          if 'class="drawerAdmin"' not in s:
              marker = '<div class="drawerPanel">'
              if marker in s:
                  s = s.replace(marker, marker + drawer_button, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: adicionar acesso admin [admin-button-added]"
          git push