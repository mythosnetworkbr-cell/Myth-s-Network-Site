name: Discord Bot

on:
  push:
    paths:
      - 'discord/**'
      - '.github/workflows/discord-bot.yml'
  pull_request:
    paths:
      - 'discord/**'
      - '.github/workflows/discord-bot.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord/package.json
      - run: npm install
      - run: npm run build
