name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prepare-apk-release

jobs:
  build-apk:
    name: Build production APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Expo and EAS CLI
        run: npm install --global eas-cli@latest

      - name: Configure EAS production environment
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          eas env:create --name EXPO_PUBLIC_SUPABASE_URL --value "$SUPABASE_URL" --environment production --visibility plaintext --force --non-interactive
          eas env:create --name EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY --value "$SUPABASE_KEY" --environment production --visibility plaintext --force --non-interactive
          echo "EAS production Supabase variables configured"
          eas env:list --environment production --non-interactive

      - name: Validate Expo project
        run: npx expo-doctor

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production-apk --non-interactive --wait

      - name: Download APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(eas build:list --platform android --profile production-apk --limit 1 --status finished --json --non-interactive | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s); if(!a[0]?.artifacts?.buildUrl) process.exit(1); console.log(a[0].artifacts.buildUrl)})")
          curl --fail --location "$URL" --output RPGRAMBR-production.apk
          test -s RPGRAMBR-production.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGRAMBR-production-apk
          path: RPGRAMBR-production.apk
          if-no-files-found: error
          retention-days: 30

# Trigger fresh production build after Supabase environment fix.
