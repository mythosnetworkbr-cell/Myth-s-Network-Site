name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prepare-apk-release

jobs:
  build-apk:
    name: Build production APK (local Gradle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Deduplicate dependencies
        run: npm dedupe --no-audit --no-fund
      - name: Repair and validate launcher icon
        run: |
          mkdir -p assets
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cat > /tmp/rpgram-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" rx="220" fill="#09010F"/>
            <rect x="96" y="96" width="832" height="832" rx="190" fill="#5B21B6"/>
            <rect x="120" y="120" width="784" height="784" rx="170" fill="#8B5CF6"/>
            <circle cx="512" cy="512" r="310" fill="#09010F" opacity="0.88"/>
            <text x="512" y="620" text-anchor="middle" font-family="DejaVu Sans" font-size="360" font-weight="900" fill="#FFFFFF">R</text>
          </svg>
          SVG
          convert -background none /tmp/rpgram-icon.svg -resize 1024x1024! assets/icon.png
          file assets/icon.png
          test -s assets/icon.png
      - name: Validate Expo project
        run: npx expo-doctor
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Locate APK
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" RPGRAMBR-production.apk
          test -s RPGRAMBR-production.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGRAMBR-production-apk
          path: RPGRAMBR-production.apk
          if-no-files-found: error
          retention-days: 30
