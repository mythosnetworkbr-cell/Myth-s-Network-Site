name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - prepare-apk-release

jobs:
  build-apk:
    name: Build production APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS CLI
        run: npm install --global eas-cli@latest

      - name: Build APK with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile production-apk --non-interactive --wait

      - name: Download APK from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          URL=$(eas build:list --platform android --profile production-apk --limit 1 --status finished --json --non-interactive | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s); if(!a[0]?.artifacts?.buildUrl) process.exit(1); console.log(a[0].artifacts.buildUrl)})")
          curl -L "$URL" -o RPGRAMBR-production.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGRAMBR-production-apk
          path: RPGRAMBR-production.apk
          if-no-files-found: error
          retention-days: 30
