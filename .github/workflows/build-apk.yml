name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - prepare-apk-release

jobs:
  build-apk:
    name: Build production APK (local Gradle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo project
        run: npx expo-doctor

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        run: |
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" RPGRAMBR-production.apk
          test -s RPGRAMBR-production.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGRAMBR-production-apk
          path: RPGRAMBR-production.apk
          if-no-files-found: error
          retention-days: 30
