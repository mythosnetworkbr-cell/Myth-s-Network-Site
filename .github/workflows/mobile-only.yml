name: Mobile only web layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-layout:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile-only layout and login polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('App.web.tsx')
          s = p.read_text(encoding='utf-8')

          # Success notification state for login/register.
          if 'authNotice' not in s:
              s = s.replace(
                  "[email,setEmail]=useState(''),[password,setPassword]=useState(''),[name,setName]=useState(''),[error,setError]=useState(''),",
                  "[email,setEmail]=useState(''),[password,setPassword]=useState(''),[name,setName]=useState(''),[error,setError]=useState(''),[authNotice,setAuthNotice]=useState(''),"
              )

              s = s.replace(
                  "useEffect(()=>{if(session)loadTickets()},[session]);",
                  "useEffect(()=>{if(session)loadTickets()},[session]);\n useEffect(()=>{if(!authNotice)return;const timer=setTimeout(()=>setAuthNotice(''),3200);return()=>clearTimeout(timer)},[authNotice]);"
              )

              s = s.replace(
                  "if(r.error)setError(r.error.message)}catch(e:any){setError(e.message||'Falha na autenticação.')}",
                  "if(r.error)setError(r.error.message);else setAuthNotice(mode==='login'?'LOGIN_OK':'REGISTER_OK')}catch(e:any){setError(e.message||'Falha na autenticação.')}",
                  1
              )

              s = s.replace(
                  "{error&&<div className=\"toast\">{error}<button onClick={()=>setError('')}>×</button></div>}",
                  "{error&&<div className=\"toast\">{error}<button onClick={()=>setError('')}>×</button></div>}{authNotice&&<div className=\"authSuccess\">{authNotice==='LOGIN_OK'?'LOGIN REALIZADO':'CONTA CRIADA'}<span>{authNotice==='LOGIN_OK'?'Bem-vindo de volta à Mythøs Network.':'Sua conta foi criada com sucesso. Bem-vindo à cidade!'}</span></div>}"
              )

          css = r'''const mobileOnlyCss=`
*{box-sizing:border-box}
html,body,#root{width:100%;min-width:320px;max-width:480px;margin:0 auto;overflow-x:hidden;background:#030509}
html{background:#030509}
body{min-height:100svh;overscroll-behavior-y:none}
#root{min-height:100svh}
.app{width:100%;max-width:480px;margin:0 auto;min-height:100svh;overflow-x:hidden}
.header{height:68px;padding:0 16px;gap:10px}
.brandWords,.profile{display:none}
.mobileBtn{display:block;margin-left:auto}
.nav{display:none;position:absolute;z-index:50;top:62px;left:10px;right:10px;flex-direction:column;align-items:stretch;background:rgba(9,11,16,.98);padding:10px;border:1px solid rgba(33,215,238,.18);border-radius:16px;box-shadow:0 18px 45px rgba(0,0,0,.6)}
.nav.navOpen{display:flex}
.navBtn,.logout{width:100%;text-align:left;padding:15px 14px}

/* Smartphone login: true 9:16-friendly composition, no desktop split. */
.auth{position:relative;display:flex;flex-direction:column;width:100%;min-height:100svh;height:auto;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(33,215,238,.13),transparent 30%),radial-gradient(circle at 90% 70%,rgba(212,76,255,.12),transparent 35%),#030509}
.authHero{position:relative;display:flex!important;flex:0 0 auto;width:100%;height:31svh;min-height:225px;max-height:310px;padding:24px 20px 22px;align-items:flex-end;justify-content:flex-start;overflow:hidden;border-radius:0 0 28px 28px;background-image:linear-gradient(180deg,rgba(3,5,9,.10) 0%,rgba(3,5,9,.18) 38%,rgba(3,5,9,.96) 100%),url('https://i.imgur.com/VUCnZli.png');background-size:cover;background-position:center;box-shadow:0 18px 55px rgba(0,0,0,.55);animation:loginHeroIn .65s cubic-bezier(.2,.8,.2,1) both}
.authHero::after{content:"";position:absolute;right:-18px;top:18px;width:104px;height:150px;border-radius:24px;background-image:linear-gradient(180deg,rgba(3,5,9,.04),rgba(3,5,9,.78)),url('https://samp.eu5.org/images/sa-mp-078.jpg');background-size:cover;background-position:center;opacity:.58;transform:rotate(7deg);box-shadow:0 18px 45px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);animation:loginCardIn .8s .12s cubic-bezier(.2,.8,.2,1) both}
.authHero::before{content:"MYTHØS NETWORK";position:absolute;z-index:2;left:20px;top:18px;padding:8px 11px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);font-size:9px;font-weight:800;letter-spacing:2px;color:#fff}
.authHero .eyebrow{position:relative;z-index:3;margin:0 0 6px;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.8)}
.authHero h1{position:relative;z-index:3;margin:0;font-size:clamp(28px,8.5vw,42px);line-height:.98;letter-spacing:-1.7px;text-shadow:0 5px 28px rgba(0,0,0,.8);animation:loginTextIn .55s .16s both}
.authHero p{display:none}
.authPanel{position:relative;z-index:4;width:100%;max-width:480px;min-height:69svh;margin:-1px auto 0;padding:26px 20px 34px;border:0;border-radius:26px 26px 0 0;background:linear-gradient(180deg,rgba(9,12,18,.98),rgba(4,6,10,.99));box-shadow:0 -18px 50px rgba(0,0,0,.28);justify-content:flex-start;overflow:visible;animation:loginPanelIn .65s .08s cubic-bezier(.2,.8,.2,1) both}
.authBrand{justify-content:center;margin-bottom:20px;gap:11px}
.authBrand .logo{animation:logoPulse 2.8s ease-in-out infinite}
.authBrand b{font-size:18px;letter-spacing:.4px}
.authBrand small{display:block;color:#7e8792;font-size:10px;letter-spacing:1.8px;margin-top:3px}
.authPanel>.eyebrow{text-align:center;display:block;margin-top:4px}
.authPanel h2{text-align:center;font-size:32px;line-height:1.05;letter-spacing:-1px;margin:9px 0 20px}
.authPanel .field{width:100%;margin-bottom:13px;animation:fieldIn .45s both}
.authPanel .field:nth-of-type(2){animation-delay:.06s}
.authPanel .field:nth-of-type(3){animation-delay:.11s}
.authPanel .field input{width:100%;height:56px;min-height:56px;border-radius:14px;background:#080b11;border:1px solid rgba(255,255,255,.12);font-size:16px;line-height:1.2;padding:0 16px;color:#fff;outline:none;transition:border-color .2s,box-shadow .2s,transform .2s}
.authPanel .field input:focus{border-color:rgba(33,215,238,.7);box-shadow:0 0 0 4px rgba(33,215,238,.08);transform:translateY(-1px)}
.authPanel .primary{width:100%;height:56px;border-radius:14px;font-size:13px;background:linear-gradient(100deg,#ff1744,#ff245b,#d44cff);color:#fff;box-shadow:0 12px 34px rgba(255,23,68,.24);transition:transform .18s,box-shadow .18s;animation:buttonIn .5s .15s both}
.authPanel .primary:active{transform:scale(.985)}
.authPanel .google{width:100%;height:54px;border-radius:14px;transition:transform .18s}
.authPanel .google:active{transform:scale(.985)}
.authPanel .switch{display:block;width:100%;text-align:center;padding:12px 8px;font-size:13px}
.divider{margin:16px 0 12px}
.authError{margin-top:12px}
.authSuccess{position:fixed;z-index:100;left:12px;right:12px;top:78px;display:flex;flex-direction:column;gap:3px;padding:13px 15px;border-radius:15px;border:1px solid rgba(33,215,238,.35);background:linear-gradient(135deg,rgba(8,17,22,.97),rgba(12,7,20,.97));box-shadow:0 16px 45px rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:900;letter-spacing:.7px;animation:successIn .42s cubic-bezier(.2,.8,.2,1) both}
.authSuccess span{font-size:11px;font-weight:500;letter-spacing:0;color:#aab3bf;line-height:1.45}

.hero,.section{width:100%;max-width:480px;margin:0 auto}
.hero{padding:54px 20px 48px}
.hero h1{font-size:42px;line-height:1.02;letter-spacing:-1.8px}
.hero p{font-size:14px;line-height:1.65}
.actions{flex-direction:column;gap:10px}
.primaryLink,.secondaryLink{width:100%;min-height:52px}
.section{padding:42px 20px}
.section h1{font-size:36px;letter-spacing:-1px}
.section h2{font-size:28px}
.features{grid-template-columns:1fr;gap:10px}
.features button,.features a{min-height:130px;padding:22px}
.ticketLayout{grid-template-columns:1fr;gap:12px}
.chat{min-height:0;padding:17px}
.msg{max-width:88%}
.ruleTools{justify-content:stretch}
.ruleTools button{flex:1}
.rule>button{grid-template-columns:42px 1fr 22px;padding:17px 14px}
.rule>div{padding:0 16px 18px}
.rule p{gap:10px;font-size:13px}
.form{padding:18px;border-radius:16px}
.formActions{flex-direction:column}
.formActions button{width:100%;min-height:50px}
.pageRow .primary{width:100%;margin-top:14px}
footer{width:100%;max-width:480px;padding:36px 20px 26px;grid-template-columns:1fr;gap:14px}
footer div{flex-direction:column;gap:10px}
footer a{display:block}
.toast{left:12px;right:12px;top:78px}

@keyframes loginHeroIn{from{opacity:0;transform:translateY(-18px) scale(1.03)}to{opacity:1;transform:none}}
@keyframes loginCardIn{from{opacity:0;transform:translate(22px,-14px) rotate(10deg)}to{opacity:.58;transform:rotate(7deg)}}
@keyframes loginTextIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes loginPanelIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fieldIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes buttonIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes logoPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(33,215,238,.0)}50%{transform:scale(1.035);box-shadow:0 0 28px rgba(33,215,238,.18)}}
@keyframes successIn{from{opacity:0;transform:translateY(-14px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
`;

          # Replace an existing injected CSS block, or insert it at the known marker.
          block = re.compile(r"const mobileOnlyCss=`.*?`;", re.S)
          if block.search(s):
              s = block.sub(css.rstrip(), s, count=1)
          else:
              marker = "if(typeof document!=='undefined'){"
              if marker not in s:
                  raise SystemExit('CSS injection marker not found.')
              s = s.replace(marker, css+'\n'+marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit mobile layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.web.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: polish smartphone login animations and imagery [mobile-only]"
          git push
