name: Mobile only web layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  mobile-layout:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-only]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mobile-only layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.web.tsx')
          s = p.read_text(encoding='utf-8')
          if 'const mobileOnlyCss=' in s:
              raise SystemExit('Mobile layout already applied.')
          marker = "if(typeof document!=='undefined'){"
          if marker not in s:
              raise SystemExit('CSS injection marker not found.')
          css = r'''const mobileOnlyCss=`
html,body,#root{width:100%;min-width:320px;max-width:480px;margin:0 auto;overflow-x:hidden;background:#030509}
body{min-height:100svh}
.app{width:100%;max-width:480px;margin:0 auto;min-height:100svh;overflow-x:hidden}
.header{height:68px;padding:0 16px;gap:10px}
.brandWords,.profile{display:none}
.mobileBtn{display:block;margin-left:auto}
.nav{display:none;position:absolute;top:62px;left:10px;right:10px;flex-direction:column;align-items:stretch;background:rgba(9,11,16,.98);padding:10px;border:1px solid rgba(33,215,238,.18);border-radius:16px;box-shadow:0 18px 45px rgba(0,0,0,.6)}
.nav.navOpen{display:flex}
.navBtn,.logout{width:100%;text-align:left;padding:15px 14px}
.auth{display:block;width:100%;min-height:100svh;background:radial-gradient(circle at 50% 0%,rgba(33,215,238,.10),transparent 30%),radial-gradient(circle at 80% 70%,rgba(212,76,255,.10),transparent 32%),#030509}
.authHero{display:none}
.authPanel{width:100%;min-height:100svh;max-width:480px;margin:0 auto;padding:34px 22px 42px;border:0;background:transparent;justify-content:center}
.authBrand{justify-content:center;margin-bottom:28px;gap:12px}
.authBrand b{font-size:18px;letter-spacing:.4px}
.authBrand small{display:block;color:#7e8792;font-size:10px;letter-spacing:1.8px;margin-top:3px}
.authPanel>.eyebrow{text-align:center;display:block;margin-top:8px}
.authPanel h2{text-align:center;font-size:34px;letter-spacing:-1px;margin:10px 0 24px}
.authPanel .field{width:100%;margin-bottom:15px}
.authPanel .field input{height:56px;border-radius:14px;background:#080b11;border:1px solid rgba(255,255,255,.12);font-size:16px}
.authPanel .primary{height:56px;border-radius:14px;font-size:13px;background:linear-gradient(90deg,#ff1744,#ff245b);color:#fff;box-shadow:0 10px 30px rgba(255,23,68,.22)}
.authPanel .google{height:54px;border-radius:14px}
.authPanel .switch{display:block;width:100%;text-align:center;padding:12px}
.hero,.section{width:100%;max-width:480px;margin:0 auto}
.hero{padding:54px 20px 48px}
.hero h1{font-size:42px;line-height:1.02;letter-spacing:-1.8px}
.hero p{font-size:14px;line-height:1.65}
.actions{flex-direction:column;gap:10px}
.primaryLink,.secondaryLink{width:100%;min-height:52px}
.section{padding:42px 20px}
.section h1{font-size:36px;letter-spacing:-1px}
.section h2{font-size:28px}
.features{grid-template-columns:1fr;gap:10px}
.features button,.features a{min-height:130px;padding:22px}
.ticketLayout{grid-template-columns:1fr;gap:12px}
.chat{min-height:0;padding:17px}
.msg{max-width:88%}
.ruleTools{justify-content:stretch}
.ruleTools button{flex:1}
.rule>button{grid-template-columns:42px 1fr 22px;padding:17px 14px}
.rule>div{padding:0 16px 18px}
.rule p{gap:10px;font-size:13px}
.form{padding:18px;border-radius:16px}
.formActions{flex-direction:column}
.formActions button{width:100%;min-height:50px}
.pageRow .primary{width:100%;margin-top:14px}
footer{width:100%;max-width:480px;padding:36px 20px 26px;grid-template-columns:1fr;gap:14px}
footer div{flex-direction:column;gap:10px}
footer a{display:block}
.toast{left:12px;right:12px;top:78px}
`;
            p.write_text(s.replace(marker, css+'\n'+marker), encoding='utf-8')
          PY

      - name: Commit mobile layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.web.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: mobile-only Mythos web layout [mobile-only]"
          git push
