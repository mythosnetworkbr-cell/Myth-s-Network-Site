name: Add Admin Access Button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-admin-button:
    if: github.event.head_commit.message != 'chore: adicionar acesso ao painel admin no site'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add admin button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = '''.adminAccess{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:11px;background:linear-gradient(135deg,#ffb000,#ff4d00);border:1px solid #ffc44d;color:#160900;font-size:12px;font-weight:950;box-shadow:0 8px 25px #ff7a001f;white-space:nowrap}.adminAccess:hover{filter:brightness(1.08);transform:translateY(-1px)}@media(max-width:900px){.adminAccess{display:flex;width:100%;margin-top:10px;padding:14px}.drawerAdmin{display:block!important}}'''
          if '.adminAccess{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          button = '<a class="adminAccess" href="/painel-admin">⚙ PAINEL ADMIN</a>'
          if 'class="adminAccess"' not in s:
              s = s.replace('<div class="navRight"><button class="menuBtn"', '<div class="navRight">' + button + '<button class="menuBtn"', 1)

          drawer_button = '<a class="drawerAdmin" href="/painel-admin" style="display:block;color:#ffb000;font-weight:950">⚙ PAINEL ADMINISTRATIVO</a>'
          if 'class="drawerAdmin"' not in s:
              marker = '<div class="drawerPanel">'
              if marker in s:
                  s = s.replace(marker, marker + drawer_button, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Admin button already present"
            exit 0
          fi
          git commit -m "chore: adicionar acesso ao painel admin no site"
          git push