name: Lumis Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build

      - name: Package
        run: |
          cd dist
          zip -r ../Lumis-Web-${GITHUB_REF_NAME:-manual}.zip .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lumis ${{ github.ref_name }}
          generate_release_notes: true
          files: Lumis-Web-${{ github.ref_name }}.zip
