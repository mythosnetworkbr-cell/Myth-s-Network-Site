name: expo_DC build

on:
  push:
    paths:
      - 'expo_DC/**'
      - '.github/workflows/expo-dc-build.yml'
  pull_request:
    paths:
      - 'expo_DC/**'
      - '.github/workflows/expo-dc-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo_DC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo_DC/package.json
      - name: Install dependencies
        run: npm install
      - name: TypeScript build
        run: npm run build
