name: Mythøs Site Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source files
        run: |
          test -s App.web.tsx
          test -s package.json
          test -s vercel.json
          test -s api/_github.ts
          test -s api/candidatos.ts
          test -s api/ponto.ts
          echo "Mythøs source guard OK"
