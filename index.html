<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mythøs Network</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050507;color:#fff;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 20% 10%,#ff17442b,transparent 30%),radial-gradient(circle at 85% 15%,#9c4dff2b,transparent 32%),linear-gradient(135deg,#050507,#101016)}.login{width:min(560px,100%);border:1px solid #d8b14a;border-radius:12px;background:#090a0cf5;box-shadow:0 30px 100px #000;overflow:hidden}.cover{min-height:280px;padding:35px 24px 110px;display:flex;align-items:flex-end;background:linear-gradient(180deg,#0002,#000d),url('https://samp.eu5.org/images/sa-mp-078.jpg') center/cover}.brand{font-weight:1000;font-size:clamp(54px,15vw,88px);line-height:.8;letter-spacing:2px;text-transform:uppercase;color:#f5f1df;text-shadow:4px 4px #111,0 12px 35px #000}.brand small{display:block;font-size:11px;letter-spacing:5px;text-align:center;margin-top:17px;color:#fff}.box{margin:-75px 16px 18px;position:relative;padding:22px;border:2px solid #d8b14a;border-radius:9px;background:linear-gradient(180deg,#181a16,#070809);box-shadow:0 18px 55px #000}.eyebrow{font-size:10px;letter-spacing:2px;color:#ffd84a;font-weight:900}.box h1{font-size:29px;margin:9px 0 5px}.muted{color:#a9abb3;font-size:13px;line-height:1.55}.city{border:1px solid #6f633c;border-radius:7px;padding:13px;margin:16px 0;background:#0c0e0bf5}.city b{display:block;color:#ffd84a;font-size:12px;margin-bottom:8px}.city select,input,button{font:inherit}.city select,.field input{width:100%;padding:14px;border-radius:6px;border:1px solid #5b5748;background:#050607;color:#fff;outline:0}.field{display:block;margin:13px 0;color:#c9c7b8;font-size:11px;font-weight:900;letter-spacing:1px}.field input{margin-top:7px}.primary{width:100%;padding:14px;border-radius:6px;border:1px solid #f6d879;background:linear-gradient(#e4bd52,#9d6f1d);color:#17130a;font-weight:1000;letter-spacing:1px;cursor:pointer}.linkBtn{width:100%;padding:11px;border:0;background:transparent;color:#aaa;text-decoration:underline;cursor:pointer}.error{margin:12px 0;padding:11px;border-radius:6px;background:#4a100f;border:1px solid #d14a4a;color:#ffd0d0}.hidden{display:none}.dash{width:min(760px,100%);min-height:90vh;border:1px solid #3b3b4d;border-radius:18px;background:#09090ff2;box-shadow:0 30px 100px #000;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid #2f2f3f;background:#08080df5;position:sticky;top:0}.logo{font-weight:1000;letter-spacing:2px}.top button{border:1px solid #444454;background:#11111a;color:#fff;border-radius:8px;padding:9px 12px}.content{padding:22px}.hero{padding:30px 22px;border-radius:18px;background:linear-gradient(180deg,#0004,#05050bf2),url('https://samp.eu5.org/images/sa-mp-078.jpg') center/cover}.hero h2{font-size:42px;margin:10px 0}.gradient{background:linear-gradient(90deg,#ff1744,#a64cff,#00d9ff);background-clip:text;-webkit-background-clip:text;color:transparent}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.card{padding:17px;border:1px solid #303044;border-radius:14px;background:#0d0d15}.card b{font-size:28px;color:#ff526f}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{white-space:nowrap;padding:10px 13px;border-radius:9px;border:1px solid #363648;background:#101019;color:#fff}.section{margin-top:20px}.list{padding:13px 0;border-bottom:1px solid #292938}.logout{border-color:#7d263d!important;color:#ff8da0!important}@media(max-width:500px){.shell{padding:0}.login,.dash{min-height:100vh;border-radius:0;border-left:0;border-right:0}.cover{min-height:250px}.box{margin-top:-65px}.grid{grid-template-columns:1fr}.hero h2{font-size:35px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const CITIES=['Lex City RP','Nyx Roleplay'];const APK='https://www.mediafire.com/file/nv1thw9hmk88kk9/MythosNetworkSAMP-release%25282%2529.apk/file';const DC='https://discord.gg/vJb2Aqzda';
let city=localStorage.getItem('mythos_city')||CITIES[0],mode='login',session=null;
const root=document.getElementById('root');
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function login(){root.innerHTML=`<div class="shell"><section class="login"><div class="cover"><div class="brand">${esc(city)}<small>MYTHØS NETWORK</small></div></div><div class="box"><div class="eyebrow">CENTRAL OFICIAL • SA-MP ROLEPLAY</div><h1 id="title"></h1><p class="muted" id="desc"></p><div class="city"><b>ESCOLHA SEU SERVIDOR</b><select id="city">${CITIES.map(c=>`<option ${c===city?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div id="err"></div><form id="form">${mode==='signup'?'<label class="field">NOME<input id="name" required></label>':''}<label class="field">E-MAIL<input id="email" type="email" required></label>${mode!=='forgot'?'<label class="field">SENHA<input id="password" type="password" minlength="6" required></label>':''}<button class="primary">${mode==='login'?'ENTRAR':mode==='signup'?'CRIAR CONTA':'SOLICITAR RECUPERAÇÃO'}</button></form>${mode==='login'?'<button class="linkBtn" id="forgot">Esqueci minha senha</button>':''}<button class="linkBtn" id="switch">${mode==='login'?'Ainda não tem conta? Criar agora':'Já possui conta? Entrar'}</button><p class="muted" style="text-align:center;margin:15px 0 0">${esc(city)} • Criada por <b>Mythøs Network</b></p></div></section></div>`;
const title=document.getElementById('title');const desc=document.getElementById('desc');title.textContent=mode==='login'?'Entrar na cidade':mode==='signup'?'Criar conta':'Recuperar acesso';desc.textContent=mode==='login'?'Escolha o servidor e entre na sua conta.':mode==='signup'?'Crie sua conta para acessar a comunidade.':'Recupere o acesso à sua conta Mythøs Network.';
document.getElementById('city').onchange=e=>{city=e.target.value;localStorage.setItem('mythos_city',city);login()};document.getElementById('switch').onclick=()=>{mode=mode==='login'?'signup':'login';login()};if(document.getElementById('forgot'))document.getElementById('forgot').onclick=()=>{mode='forgot';login()};document.getElementById('form').onsubmit=authSubmit}
async function authSubmit(e){e.preventDefault();const err=document.getElementById('err');err.innerHTML='';if(mode==='forgot'){err.innerHTML='<div class="error">Para redefinir a senha, entre em contato com a equipe pelo suporte.</div>';return}const email=document.getElementById('email').value,password=document.getElementById('password').value,name=document.getElementById('name')?.value||'';try{const action=mode==='login'?'login':'signup';const r=await fetch('/api/auth?action='+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,displayName:name})});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível concluir a operação.');localStorage.setItem('mythos_local_session',JSON.stringify({token:d.token,user:d.user}));session=d;dashboard()}catch(x){err.innerHTML='<div class="error">'+esc(x.message)+'</div>'}}
async function dashboard(){const raw=localStorage.getItem('mythos_local_session');if(raw&&!session)try{const s=JSON.parse(raw);const r=await fetch('/api/auth?action=me',{headers:{Authorization:'Bearer '+s.token}});const d=await r.json();if(d.user)session={token:s.token,user:d.user};else throw 0}catch{localStorage.removeItem('mythos_local_session');return login()}if(!session)return login();root.innerHTML=`<div class="shell"><section class="dash"><header class="top"><div><div class="logo">MØ • ${esc(city)}</div><small class="muted">Criada por Mythøs Network</small></div><button class="logout" id="logout">SAIR</button></header><main class="content"><section class="hero"><div class="eyebrow">${esc(city)} • ROLEPLAY • MOBILE</div><h2>O seu mundo.<br><span class="gradient">Do seu celular.</span></h2><p class="muted">Central oficial da comunidade Mythøs Network.</p><a class="primary" style="display:block;text-align:center;text-decoration:none" href="${APK}" target="_blank">BAIXAR APK</a><a class="linkBtn" href="${DC}" target="_blank">ENTRAR NO DISCORD</a></section><div class="grid"><div class="card"><b id="count">—</b><div class="muted">Jogadores cadastrados</div></div><div class="card"><b>8</b><div class="muted">Categorias de suporte</div></div></div><div class="tabs"><button onclick="cityPick()">CIDADE: ${esc(city)}</button><button onclick="showNews()">NOTÍCIAS</button><button onclick="showRules()">REGRAS</button><button onclick="showTickets()">TICKETS</button></div><section id="section" class="section"><h2>Bem-vindo, ${esc(session.user.display_name||session.user.email)}</h2><p class="muted">Você está conectado à central de ${esc(city)}.</p><div class="grid"><div class="card"><h3>Comunidade</h3><p class="muted">Acompanhe novidades e eventos oficiais.</p></div><div class="card"><h3>Suporte</h3><p class="muted">Abra tickets para atendimento da equipe.</p></div></div></section></main></section></div>`;document.getElementById('logout').onclick=()=>{localStorage.removeItem('mythos_local_session');session=null;mode='login';login()};fetch('/api/db?table=stats').then(r=>r.json()).then(d=>{document.getElementById('count').textContent=d.count||0}).catch(()=>{});}
function cityPick(){const next=city===CITIES[0]?CITIES[1]:CITIES[0];city=next;localStorage.setItem('mythos_city',city);dashboard()}
function showNews(){document.getElementById('section').innerHTML='<h2>Notícias</h2>'+['Operação policial movimenta a cidade','Novo lote de veículos chega ao servidor','Evento especial da comunidade neste fim de semana'].map(x=>'<div class="list"><b>'+x+'</b><p class="muted">Comunicado oficial da Mythøs Network.</p></div>').join('')}
function showRules(){document.getElementById('section').innerHTML='<h2>Regras</h2><div class="card"><b>AVISO CRÍTICO À COMUNIDADE</b><p class="muted">Leia o regulamento completo antes de jogar. As regras oficiais ficam disponíveis na central da comunidade.</p></div>'}
async function showTickets(){document.getElementById('section').innerHTML='<h2>Tickets</h2><button class="primary" id="newTicket">＋ ABRIR NOVO TICKET</button><div id="ticketList" class="section"><p class="muted">Carregando...</p></div>';try{const r=await fetch('/api/db?table=tickets',{headers:{Authorization:'Bearer '+session.token}});const d=await r.json();document.getElementById('ticketList').innerHTML=(d.tickets||[]).map(t=>'<div class="list"><b>'+esc(t.subject)+'</b><p class="muted">'+esc(t.category)+' • '+esc(t.status)+'</p></div>').join('')||'<p class="muted">Nenhum ticket encontrado.</p>'}catch{document.getElementById('ticketList').innerHTML='<p class="muted">Não foi possível carregar os tickets.</p>'}}
login();
</script>
</body>
</html>
