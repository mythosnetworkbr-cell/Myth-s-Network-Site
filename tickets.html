<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suporte • Rede Mythøs</title><style>*{box-sizing:border-box}body{margin:0;background:#050507;color:#fff;font-family:Inter,system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 0 28px}.logo{font-size:22px;font-weight:950}.logo span{background:linear-gradient(90deg,#18d9ff,#a83cff,#ff18d0);background-clip:text;color:transparent}.grid{display:grid;grid-template-columns:380px 1fr;gap:16px}.box{border:1px solid #292936;border-radius:18px;background:linear-gradient(145deg,#12121a,#08080c);padding:22px}.box h1,.box h2{margin-top:0}.muted{color:#8c8c98;font-size:12px;line-height:1.6}.field,select,textarea{width:100%;margin:6px 0 10px;padding:13px 14px;border-radius:10px;border:1px solid #30303a;background:#07070b;color:#fff;outline:0}textarea{min-height:130px;resize:vertical}.btn{width:100%;padding:13px;border-radius:10px;border:1px solid #18e0f5;background:#0ed9eb;color:#031014;font-weight:950;cursor:pointer}.btn.alt{background:#17171d;color:#fff;border-color:#343440;margin-top:8px}.msg{min-height:22px;color:#ff719e;font-size:12px}.ticketHead{display:flex;justify-content:space-between;gap:12px;align-items:start}.badge{padding:6px 9px;border-radius:999px;background:#13242a;color:#25e4f6;font-size:10px;font-weight:900}.messages{max-height:520px;overflow:auto;margin:18px 0}.message{padding:13px;margin:9px 0;border:1px solid #292936;border-radius:12px;background:#0b0b10}.message.staff{border-color:#6539a5;background:#130d1c}.message small{display:block;color:#777783;font-size:10px;margin-bottom:6px}.lookup{display:flex;gap:8px}.lookup input{margin:0}.lookup .btn{width:auto;min-width:120px}.hidden{display:none}@media(max-width:760px){main{padding:16px}.grid{grid-template-columns:1fr}.box{padding:18px}.lookup{flex-direction:column}.lookup .btn{width:100%}}</style></head><body><main><div class="top"><div class="logo">REDE <span>MYTHØS</span></div><a href="/" style="color:#20ddf5;text-decoration:none;font-size:12px">← VOLTAR</a></div><div class="grid"><section class="box"><h1>Suporte</h1><p class="muted">Abra seu atendimento sem criar conta. Depois, guarde o código do ticket para acompanhar e responder diretamente por esta página.</p><form id="create"><input class="field" id="name" placeholder="Seu nome" required><select id="category" required><option value="">Selecione o atendimento</option><option>Reclamação contra Jogadores</option><option>Entender Punição</option><option>Reclamação contra Orgs</option><option>Reclamação Técnica</option><option>Marcar Ação</option><option>Solicitar Ajuda</option><option>Seja Influência</option><option>Candidato a Administração</option></select><input class="field" id="subject" placeholder="Assunto" required><textarea id="body" placeholder="Descreva o que aconteceu..." required></textarea><button class="btn">ABRIR TICKET</button><div id="createMsg" class="msg"></div></form></section><section class="box"><h2>Meus atendimentos</h2><p class="muted">Informe o código recebido ao abrir o ticket.</p><div class="lookup"><input class="field" id="code" placeholder="Ex.: MYT-AB12CD34"><button class="btn" onclick="loadTicket()">ACESSAR</button></div><div id="ticket" class="hidden"><div class="ticketHead"><div><h2 id="title"></h2><div class="muted" id="meta"></div></div><span class="badge" id="status"></span></div><div id="messages" class="messages"></div><textarea id="reply" placeholder="Escreva uma mensagem..."></textarea><button class="btn" onclick="replyTicket()">ENVIAR MENSAGEM</button><div id="replyMsg" class="msg"></div></div></section></div></main><script>let current=null;const $=x=>document.getElementById(x);async function loadTicket(){const code=$("code").value.trim().toUpperCase();if(!code)return;$('replyMsg').textContent='';try{const r=await fetch('/api/tickets?code='+encodeURIComponent(code));const j=await r.json();if(!r.ok)throw Error(j.error||'Ticket não encontrado.');current=j.ticket;render()}catch(e){$('replyMsg').textContent=e.message}}function render(){if(!current)return;$('ticket').classList.remove('hidden');$('title').textContent=current.subject;$('meta').textContent=current.code+' • '+current.category+' • '+current.name;$('status').textContent=current.status==='closed'?'ENCERRADO':current.status==='waiting_user'?'AGUARDANDO VOCÊ':'EM ATENDIMENTO';$('messages').innerHTML=current.messages.map(m=>'<div class="message '+(m.staff?'staff':'')+'"><small>'+esc(m.author)+' • '+new Date(m.created_at).toLocaleString('pt-BR')+(m.staff?' • EQUIPE':'' )+'</small><div>'+esc(m.body).replace(/\n/g,'<br>')+'</div></div>').join('');$('reply').disabled=current.status==='closed'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('create').addEventListener('submit',async e=>{e.preventDefault();$('createMsg').textContent='';try{const r=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',name:$('name').value,category:$('category').value,subject:$('subject').value,body:$('body').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Não foi possível abrir.');current=j.ticket;$('code').value=current.code;$('createMsg').textContent='Ticket aberto: '+current.code;render();$('create').reset()}catch(e){$('createMsg').textContent=e.message}});async function replyTicket(){if(!current)return;const body=$('reply').value.trim();if(!body)return;$('replyMsg').textContent='';try{const r=await fetch('/api/tickets',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reply',code:current.code,body})});const j=await r.json();if(!r.ok)throw Error(j.error||'Não foi possível enviar.');current=j.ticket;$('reply').value='';render()}catch(e){$('replyMsg').textContent=e.message}}</script></body></html>
